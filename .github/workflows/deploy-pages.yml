# Deploy plan-b camera-intent-app (+ Tesseract vendor) to GitHub Pages.
# Fetches latest plan-b from https://github.com/anushb1/plan-b (branch plan-b-mvp) at build time
# so you do not need to duplicate that folder inside this repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout camera-intent-app (this repo)
        uses: actions/checkout@v4

      - name: Checkout plan-b sources
        uses: actions/checkout@v4
        with:
          repository: anushb1/plan-b
          ref: plan-b-mvp
          path: plan-b

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plan-b/package-lock.json

      - name: Build static site
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}/plan-b
        working-directory: plan-b
        run: |
          chmod +x scripts/build-github-pages.sh
          ./scripts/build-github-pages.sh

      - name: Add .nojekyll
        run: touch plan-b/_site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: plan-b/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

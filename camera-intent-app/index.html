<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Complete an action — Camera Intent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eeebe3;
      --bg-dark: #0a0a0c;
      --surface: #16161a;
      --text: #f4f4f5;
      --text-dark: #18181b;
      --muted: #71717a;
      --accent: #ed4335;
      --accent-hover: #d63b2e;
      --pill: rgba(255, 255, 255, 0.12);
      --card-tint: #efd3d0;
      --radius: 16px;
      --modal-blue: #007aff;
      --modal-blue-press: #0066dd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      background: #000;
    }

    video {
      width: 100%;
      height: 100dvh;
      object-fit: cover;
      display: block;
    }

    canvas { display: none; }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 45%);
    }

    /* Intent pills — lower third, above mode strip (mockup reference) */
    .intent-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 168px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .intent-wrap.has-intents {
      opacity: 1;
      pointer-events: auto;
    }

    .intent-panel {
      width: 100%;
      max-width: 400px;
      background: transparent;
      padding: 0;
    }

    .intent-hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.35;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      max-width: 340px;
    }

    .intent-hint.hidden {
      display: none;
    }

    .intent-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .intent-label {
      display: none;
    }

    .intent-pill {
      appearance: none;
      border: none;
      padding: 12px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #0a0a0a;
      background: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .intent-pill .ico {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .intent-pill:active { transform: scale(0.98); }
    .intent-pill.hidden { display: none; }

    .intent-pill.secondary {
      font-size: 13px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.92);
    }

    .camera-modes {
      position: absolute;
      bottom: 112px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
      z-index: 8;
    }

    .camera-modes span.active { color: var(--text); font-weight: 600; }

    .shutter-row {
      position: absolute;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding-bottom: 8px;
      pointer-events: auto;
      z-index: 10;
    }

    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--surface);
      border: 2px solid rgba(255,255,255,0.2);
    }

    .shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.35);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter::after {
      content: "";
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff;
    }

    .flip {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    /* Modal — centered card (Create event mockup) */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: #fff;
      color: var(--text-dark);
      border-radius: 16px;
      padding: 0;
      transform: scale(0.94);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.28s ease;
      max-height: min(85dvh, 620px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
    }

    .backdrop.open .modal {
      transform: scale(1);
      opacity: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
      flex-shrink: 0;
    }

    .modal-header h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
      color: #1c1c1e;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      font-size: 24px;
      line-height: 1;
      color: #8e8e93;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: #f2f2f7;
      color: #1c1c1e;
    }

    .modal-body-scroll {
      overflow-y: auto;
      padding: 0 16px 16px;
      flex: 1;
      min-height: 0;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 12px;
      line-height: 1.4;
    }

    .modal-sub.hidden {
      display: none;
    }

    .event-name-field {
      margin-bottom: 16px;
    }

    .event-name-field input {
      width: 100%;
      border: none;
      padding: 0;
      font-size: 17px;
      font-weight: 700;
      color: #000;
      font-family: inherit;
      background: transparent;
    }

    .event-name-field input::placeholder {
      color: #c7c7cc;
      font-weight: 600;
    }

    .section-label {
      display: none;
    }

    .row-field {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f2f2f7;
    }

    .row-field:last-of-type {
      border-bottom: none;
    }

    .row-ico {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 2px;
      color: #8e8e93;
    }

    .row-field input,
    .row-field textarea {
      flex: 1;
      border: none;
      padding: 0;
      font-size: 16px;
      font-family: inherit;
      color: #000;
      background: transparent;
      min-width: 0;
    }

    .row-field textarea {
      min-height: 72px;
      resize: vertical;
      line-height: 1.4;
    }

    .row-field input::placeholder,
    .row-field textarea::placeholder {
      color: #c7c7cc;
    }

    .field {
      margin-bottom: 0;
    }

    .field label {
      display: none;
    }

    .more {
      margin: 4px 0 0;
      border: none;
      border-radius: 0;
      padding: 0;
      background: transparent;
    }

    .more summary {
      list-style: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 400;
      padding: 12px 0 4px;
      color: var(--modal-blue);
      user-select: none;
    }

    .more summary::-webkit-details-marker { display: none; }

    .more .field {
      margin-top: 8px;
    }

    .more .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .more .field input,
    .more .field textarea,
    .more .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    .more .field:last-child {
      margin-bottom: 8px;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      padding: 12px 16px max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid #f2f2f7;
      flex-shrink: 0;
    }

    .btn-text-cancel {
      background: none;
      border: none;
      font-size: 17px;
      font-weight: 400;
      color: var(--modal-blue);
      cursor: pointer;
      font-family: inherit;
      padding: 8px 4px;
    }

    .btn-save-blue {
      background: var(--modal-blue);
      color: #fff;
      border: none;
      font-size: 17px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-save-blue:hover {
      background: var(--modal-blue-press);
    }

    .btn {
      font-family: inherit;
      cursor: pointer;
    }

    /* Share sheet */
    .share-preview {
      font-size: 13px;
      line-height: 1.5;
      color: #3f3f46;
      background: #f4f4f5;
      padding: 12px 14px;
      border-radius: 10px;
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal[data-mode="share"] #blockAction {
      display: none;
    }

    .modal[data-mode="share"] #shareBlock {
      display: block !important;
    }

    .modal[data-mode="share"] #blockGdoc,
    .modal[data-mode="share"] #blockTodo,
    .modal[data-mode="share"] #blockNote {
      display: none !important;
    }

    #shareBlock {
      display: none;
    }

    .modal[data-mode="reminder"] .field-guests {
      display: none;
    }

    .modal[data-mode="task"] .field-guests {
      opacity: 0.9;
    }

    .modal[data-mode="gdoc"] #blockAction,
    .modal[data-mode="todolist"] #blockAction,
    .modal[data-mode="note"] #blockAction {
      display: none;
    }

    .modal[data-mode="gdoc"] #blockGdoc,
    .modal[data-mode="todolist"] #blockTodo,
    .modal[data-mode="note"] #blockNote {
      display: block !important;
    }

    #blockGdoc,
    #blockTodo,
    #blockNote {
      display: none;
    }

    .gdoc-steps {
      font-size: 14px;
      color: #3f3f46;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .todo-items {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .todo-items li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f2f2f7;
      font-size: 15px;
    }

    .todo-items input[type="checkbox"] {
      margin-top: 3px;
    }

    .note-body {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: #27272a;
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 200;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      max-width: 92vw;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .toast a {
      color: #93c5fd;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

  </style>
</head>
<body>
  <div class="app" id="app">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="overlay"></div>

    <div class="intent-wrap" id="intentWrap">
      <div class="intent-panel">
        <p class="intent-hint hidden" id="intentHint"></p>
        <div class="intent-row">
          <button type="button" class="intent-pill hidden" id="btnEvent" data-intent="event">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
            Add to Calendar
          </button>
          <button type="button" class="intent-pill hidden" id="btnTask" data-intent="task">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            Create Task
          </button>
        </div>
        <div class="intent-row">
          <button type="button" class="intent-pill hidden" id="btnGoogleDoc" data-intent="gdoc">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            Google Doc
          </button>
          <button type="button" class="intent-pill hidden" id="btnTodoList" data-intent="todolist">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l2 2 4-4"/><path d="M21 12c.5 4.5-2.2 8-7 8s-8-3.5-7-8"/></svg>
            Todo list
          </button>
        </div>
        <div class="intent-row">
          <button type="button" class="intent-pill secondary hidden" id="btnNote" data-intent="note">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Note
          </button>
          <button type="button" class="intent-pill secondary hidden" id="btnReminder" data-intent="reminder">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3L2 6"/></svg>
            Reminder
          </button>
          <button type="button" class="intent-pill secondary hidden" id="btnShare" data-intent="share">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
            Share
          </button>
        </div>
      </div>
    </div>

    <div class="camera-modes">
      <span class="active">Photo</span>
      <span>Panorama</span>
      <span>Night</span>
    </div>

    <div class="shutter-row">
      <div class="thumb" aria-hidden="true"></div>
      <button type="button" class="shutter" id="btnShutter" aria-label="Capture"></button>
      <button type="button" class="flip" id="btnFlip" aria-label="Flip camera">↻</button>
    </div>
  </div>

  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" id="actionModal" role="dialog" aria-labelledby="modalTitle" data-mode="event">
      <div class="modal-header">
        <h2 id="modalTitle">Create event</h2>
        <button type="button" class="modal-close" id="btnCloseModal" aria-label="Close">×</button>
      </div>

      <div class="modal-body-scroll" id="modalBodyScroll">
        <p class="modal-sub hidden" id="modalSub"></p>

        <div id="blockAction">
          <div class="event-name-field">
            <input type="text" id="fTitle" name="title" autocomplete="off" placeholder="Event name" />
          </div>

          <div class="modal-primary" id="modalPrimary">
            <div class="row-field">
              <svg class="row-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
              <input type="text" id="fWhen" name="when" placeholder="Mar 15 · 2:00 PM" autocomplete="off" />
            </div>
            <div class="row-field">
              <svg class="row-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-4.5 7-11a7 7 0 10-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <input type="text" id="fLoc" name="location" placeholder="Location" autocomplete="off" />
            </div>
            <div class="row-field field-guests">
              <svg class="row-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
              <textarea id="fGuests" name="guests" placeholder="Add guests" rows="2"></textarea>
            </div>
          </div>

          <details class="more" id="moreOptions">
            <summary>More options</summary>
            <div class="field">
              <label for="fNotes">Notes</label>
              <textarea id="fNotes" placeholder="Agenda, details…"></textarea>
            </div>
            <div class="field">
              <label for="fUrl">Meeting or map link</label>
              <input type="url" id="fUrl" placeholder="https://…" />
            </div>
            <div class="field">
              <label for="fRemind">Remind me before</label>
              <select id="fRemind">
                <option value="0">No extra reminder</option>
                <option value="5">5 minutes</option>
                <option value="15">15 minutes</option>
                <option value="60">1 hour</option>
                <option value="1440">1 day</option>
              </select>
            </div>
          </details>
        </div>

        <div id="shareBlock" style="display:none;">
          <p style="font-size:13px;color:#8e8e93;margin-bottom:8px;">Extracted text</p>
          <div class="share-preview" id="sharePreview"></div>
          <button type="button" class="btn" id="btnCopy" style="width:100%;margin-bottom:8px;padding:12px;border-radius:10px;border:1px solid #e5e5ea;background:#fff;font-size:16px;">Copy text</button>
          <button type="button" class="btn-save-blue" id="btnShareNative" style="width:100%;display:none;">Share…</button>
        </div>

        <div id="blockGdoc">
          <p class="gdoc-steps">
            Text will be <strong>copied</strong>, then <strong>docs.new</strong> opens a blank Google Doc. Paste there (<kbd style="font-size:12px;background:#f4f4f5;padding:2px 6px;border-radius:4px;">⌘V</kbd> / Ctrl+V).
          </p>
          <p style="font-size:12px;color:#8e8e93;margin-bottom:10px;">Full Google Docs API upload needs sign-in in a backend app—this is the standard browser workaround.</p>
          <button type="button" class="btn-save-blue" id="btnCopyOpenDocs" style="width:100%;">Copy text &amp; open Google Docs</button>
        </div>

        <div id="blockTodo">
          <p style="font-size:13px;color:#8e8e93;margin-bottom:8px;">Items from your scan</p>
          <ul class="todo-items" id="todoItems"></ul>
        </div>

        <div id="blockNote">
          <div class="event-name-field">
            <input type="text" id="fNoteTitle" placeholder="Note title" autocomplete="off" />
          </div>
          <textarea class="note-body" id="fNoteBody" placeholder="Write or edit your note…"></textarea>
        </div>
      </div>

      <div class="modal-actions" id="modalFooter">
        <button type="button" class="btn-text-cancel" id="btnCancel">Cancel</button>
        <button type="button" class="btn-save-blue" id="btnSave">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite">
    <span id="toastMsg">Saved</span>
    <a href="#" id="toastView">Open</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const btnEvent = document.getElementById("btnEvent");
    const btnTask = document.getElementById("btnTask");
    const btnGoogleDoc = document.getElementById("btnGoogleDoc");
    const btnTodoList = document.getElementById("btnTodoList");
    const btnNote = document.getElementById("btnNote");
    const btnReminder = document.getElementById("btnReminder");
    const btnShare = document.getElementById("btnShare");
    const intentHint = document.getElementById("intentHint");
    const backdrop = document.getElementById("backdrop");
    const actionModal = document.getElementById("actionModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalSub = document.getElementById("modalSub");
    const fTitle = document.getElementById("fTitle");
    const fWhen = document.getElementById("fWhen");
    const fLoc = document.getElementById("fLoc");
    const fGuests = document.getElementById("fGuests");
    const fNotes = document.getElementById("fNotes");
    const fUrl = document.getElementById("fUrl");
    const fRemind = document.getElementById("fRemind");
    const fNoteTitle = document.getElementById("fNoteTitle");
    const fNoteBody = document.getElementById("fNoteBody");
    const todoItems = document.getElementById("todoItems");
    const sharePreview = document.getElementById("sharePreview");
    const btnShareNative = document.getElementById("btnShareNative");
    const btnSave = document.getElementById("btnSave");
    const toast = document.getElementById("toast");
    const toastView = document.getElementById("toastView");
    const intentWrap = document.getElementById("intentWrap");

    let stream = null;
    let facingMode = "environment";
    let worker = null;
    let ocrBusy = false;
    let lastText = "";
    let extracted = { title: "", when: "", location: "" };
    let lastClassification = null;
    let parsedTodoLines = [];
    let currentIntent = "event";
    let lastSavedPayload = null;
    let lastBlobUrl = null;

    const OCR_INTERVAL_MS = 1500;
    const MIN_TEXT_LEN = 12;

    /** Heuristic OCR routing: calendar vs list vs long document vs note */
    function classifyScan(text) {
      const t = text.trim();
      const lower = t.toLowerCase();
      const lines = t.split(/\n/).map((l) => l.trim()).filter(Boolean);

      let scores = { event: 0, todoList: 0, document: 0, note: 0 };
      const listLineRe = /^(\s*[-*•]\s+|\s*\d+[\.)]\s+|\s*\[[ xX]\]\s+)/;
      const listLines = lines.filter((l) => listLineRe.test(l) || l.length < 80 && /^[a-z]/i.test(l));
      const bulletish = lines.filter((l) => listLineRe.test(l));

      if (/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}/i.test(t)) scores.event += 3;
      if (/\b\d{1,2}[\/\-]\d{1,2}(\/\d{2,4})?\b/.test(t)) scores.event += 2;
      if (/\b\d{1,2}:\d{2}\s*(am|pm)?\b/i.test(t)) scores.event += 2;
      if (/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(t)) scores.event += 1.5;
      if (/\b(meeting|call|zoom|teams|webex|appointment|invite @|rsvp)\b/i.test(lower)) scores.event += 1.5;

      if (bulletish.length >= 2) scores.todoList += 4;
      else if (bulletish.length === 1) scores.todoList += 2;
      if (/\b(todo|to-do|action items?|groceries|shopping list|checklist|buy:|reminder:)\b/i.test(t)) scores.todoList += 2;
      if (listLines.length >= 3 && lines.length <= 25) scores.todoList += 2;

      if (t.length > 500) scores.document += 3;
      else if (t.length > 220) scores.document += 2;
      if (/\b(subject:|dear |sincerely|regards|memo|abstract|introduction|contract|policy|report)\b/i.test(lower)) scores.document += 3;
      if (lines.length >= 4 && lines.some((l) => l.length > 100)) scores.document += 2;

      if (t.length < 180 && lines.length <= 6) scores.note += 2;
      if (scores.event === 0 && scores.todoList === 0 && scores.document === 0) scores.note += 1;

      const hasStrongDate = scores.event >= 2;
      const top = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
      let label = "Detected text";
      if (top[1] >= 2) {
        const labels = { event: "Date/time · likely schedule", todoList: "List · checklist / todos", document: "Long text · document", note: "Short note" };
        label = labels[top[0]] || label;
      }

      return {
        scores,
        hasStrongDate,
        primary: top[0],
        hint: label,
        listLines: lines.filter((l) => l.replace(listLineRe, "").trim().length > 0),
      };
    }

    function parseTodoItems(text) {
      const lines = text.split(/\n/).map((l) => l.trim()).filter(Boolean);
      const listLineRe = /^(\s*[-*•]\s+|\s*\d+[\.)]\s+|\s*\[[ xX]\]\s*)/;
      const items = [];
      for (const line of lines) {
        const cleaned = line.replace(listLineRe, "").trim();
        if (cleaned.length > 0 && cleaned.length < 400) items.push(cleaned);
      }
      return items.slice(0, 40);
    }

    function applyIntentVisibility(c) {
      const s = c.scores;
      const hasDate = s.event >= 1.5 || c.hasStrongDate;
      const looksList = s.todoList >= 2;
      const looksDoc = s.document >= 2 || lastText.length > 320;

      btnEvent.classList.toggle("hidden", !hasDate);
      btnTodoList.classList.toggle("hidden", !looksList);
      const preferDocOverList = s.document >= s.todoList + 0.5;
      btnGoogleDoc.classList.toggle("hidden", !(looksDoc && (preferDocOverList || !looksList)));
      btnTask.classList.toggle("hidden", looksList && !hasDate);

      btnNote.classList.remove("hidden");
      btnReminder.classList.remove("hidden");
      btnShare.classList.remove("hidden");

      const visible = [btnEvent, btnTask, btnGoogleDoc, btnTodoList].filter((b) => !b.classList.contains("hidden"));
      if (visible.length === 0) {
        btnGoogleDoc.classList.remove("hidden");
        btnTask.classList.remove("hidden");
      }

      let extra = "";
      if (hasDate) extra = " · Try Calendar first";
      else if (looksList) extra = " · Try Todo list";
      else if (looksDoc) extra = " · Try Google Doc";
      intentHint.textContent = c.hint + extra;
      intentHint.classList.remove("hidden");
    }

    function showIntents(show) {
      intentWrap.classList.toggle("has-intents", show);
      if (!show) {
        intentHint.classList.add("hidden");
        [
          btnEvent,
          btnTask,
          btnGoogleDoc,
          btnTodoList,
          btnNote,
          btnReminder,
          btnShare,
        ].forEach((el) => el.classList.add("hidden"));
      }
    }

    function guessTitle(text) {
      const lines = text.split(/\n/).map((l) => l.trim()).filter(Boolean);
      for (const line of lines) {
        if (line.length < 4) continue;
        if (/^\d{1,2}[\/\-]\d{1,2}/.test(line) && line.length < 30) continue;
        if (/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(line) && /\d{4}/.test(line)) continue;
        return line.slice(0, 120);
      }
      return lines[0] || "Untitled";
    }

    function extractDateTime(text) {
      const t = text.replace(/\s+/g, " ");
      const parts = [];
      const monthDay = t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,?\s*\d{4})?/i);
      if (monthDay) parts.push(monthDay[0].trim());
      const slash = t.match(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/);
      if (slash && !parts.some((p) => p.includes(slash[0]))) parts.push(slash[0]);
      const time12 = t.match(/\b\d{1,2}:\d{2}\s*(?:am|pm)\b/i);
      const time24 = t.match(/\b\d{1,2}:\d{2}\b/);
      let timeStr = "";
      if (time12) timeStr = time12[0];
      else if (time24 && !time12) timeStr = time24[0];
      let when = parts.join(" · ");
      if (timeStr) when = when ? `${when} · ${timeStr}` : timeStr;
      return when;
    }

    function extractLocation(text) {
      const patterns = [
        /(?:location|room|at|venue)\s*[:\-]?\s*([^\n]+)/i,
        /(?:conference|meeting)\s+room\s+[a-z0-9\s\-]+/i,
        /\b(room|hall|building)\s+[a-z0-9][a-z0-9\s\-]*/i,
      ];
      for (const re of patterns) {
        const m = text.match(re);
        if (m) return (m[1] || m[0]).trim().slice(0, 200);
      }
      return "";
    }

    function parseEntities(fullText) {
      const title = guessTitle(fullText);
      const when = extractDateTime(fullText);
      const location = extractLocation(fullText);
      const confidence =
        (when ? 0.45 : 0) +
        (location ? 0.35 : 0) +
        (fullText.length > 40 ? 0.2 : 0.1);
      return { title, when, location, confidence: Math.min(confidence, 1) };
    }

    async function initTesseract() {
      worker = await Tesseract.createWorker("eng", 1, { logger: () => {} });
    }

    async function startCamera() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    async function runOcrFrame() {
      if (!worker || ocrBusy || !video.videoWidth) return;
      ocrBusy = true;
      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const {
          data: { text },
        } = await worker.recognize(canvas);
        const clean = text.replace(/\|/g, "I").trim();
        if (clean.length < MIN_TEXT_LEN) {
          showIntents(false);
          return;
        }
        lastText = clean;
        const ent = parseEntities(clean);
        extracted = { title: ent.title, when: ent.when, location: ent.location };
        lastClassification = classifyScan(clean);
        parsedTodoLines = parseTodoItems(clean);
        if (parsedTodoLines.length === 0) {
          parsedTodoLines = clean.split(/\n/).map((l) => l.trim()).filter((l) => l.length > 0).slice(0, 20);
        }
        applyIntentVisibility(lastClassification);
        showIntents(true);
      } catch (e) {
        console.error(e);
      } finally {
        ocrBusy = false;
      }
    }

    function resetForm() {
      fNotes.value = "";
      fUrl.value = "";
      fRemind.value = "0";
      document.getElementById("moreOptions").open = false;
    }

    function renderTodoList() {
      todoItems.innerHTML = "";
      const items = parsedTodoLines.length ? parsedTodoLines : [extracted.title || "Item"];
      items.forEach((text, i) => {
        const li = document.createElement("li");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.id = "todo-cb-" + i;
        const lab = document.createElement("label");
        lab.htmlFor = cb.id;
        lab.textContent = text;
        li.appendChild(cb);
        li.appendChild(lab);
        todoItems.appendChild(li);
      });
    }

    function openModal(intent) {
      currentIntent = intent;
      resetForm();
      actionModal.dataset.mode = intent === "share" ? "share" : intent;

      if (intent === "share") {
        modalTitle.textContent = "Share extract";
        modalSub.textContent = "Copy or share the text recognized from the camera.";
        modalSub.classList.remove("hidden");
        sharePreview.textContent = lastText || "(No text yet — point at text and wait.)";
        btnSave.textContent = "Done";
        btnShareNative.style.display = typeof navigator !== "undefined" && navigator.share ? "block" : "none";
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        return;
      }

      if (intent === "gdoc") {
        modalTitle.textContent = "Send to Google Docs";
        modalSub.classList.add("hidden");
        btnSave.textContent = "Close";
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        return;
      }

      if (intent === "todolist") {
        modalTitle.textContent = "Todo list";
        modalSub.classList.add("hidden");
        renderTodoList();
        btnSave.textContent = "Save list";
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        return;
      }

      if (intent === "note") {
        modalTitle.textContent = "Note";
        modalSub.classList.add("hidden");
        fNoteTitle.value = guessTitle(lastText).slice(0, 120);
        fNoteBody.value = lastText || "";
        btnSave.textContent = "Save note";
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        return;
      }

      modalSub.classList.add("hidden");
      btnSave.textContent = "Save";

      fWhen.value = extracted.when || "";
      fLoc.value = extracted.location || "";
      fGuests.value = "";
      fTitle.value =
        intent === "task"
          ? `Task: ${extracted.title}`
          : intent === "reminder"
            ? extracted.title
            : extracted.title;

      if (intent === "event") {
        modalTitle.textContent = "Create event";
        fTitle.placeholder = "Event name";
        fWhen.placeholder = "Mar 15 · 2:00 PM";
        fLoc.placeholder = "Location";
        fGuests.placeholder = "Add guests";
      } else if (intent === "task") {
        modalTitle.textContent = "Create task";
        fTitle.placeholder = "Task title";
        fWhen.placeholder = "Due date · time";
        fLoc.placeholder = "Location (optional)";
        fGuests.placeholder = "Assignees (optional)";
      } else if (intent === "reminder") {
        modalTitle.textContent = "Set reminder";
        fTitle.placeholder = "Reminder";
        fWhen.placeholder = "When";
        fLoc.placeholder = "Location (optional)";
      }

      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
      actionModal.dataset.mode = "event";
      btnSave.textContent = "Save";
      todoItems.innerHTML = "";
    }

    function buildPayload() {
      return {
        intent: currentIntent,
        title: fTitle.value,
        when: fWhen.value,
        location: fLoc.value,
        guests: fGuests.value,
        notes: fNotes.value,
        meetingUrl: fUrl.value,
        remindMinutesBefore: parseInt(fRemind.value, 10) || 0,
        extractedAt: new Date().toISOString(),
      };
    }

    function showToast(msg, openUrl) {
      document.getElementById("toastMsg").textContent = msg;
      if (lastBlobUrl) {
        URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = null;
      }
      if (openUrl) {
        toastView.href = openUrl;
        toastView.style.display = "inline";
      } else {
        toastView.style.display = "none";
      }
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 4000);
    }

    function saveAction() {
      if (currentIntent === "share" || currentIntent === "gdoc") {
        closeModal();
        return;
      }

      if (currentIntent === "todolist") {
        const items = [];
        todoItems.querySelectorAll("li").forEach((li) => {
          const cb = li.querySelector("input[type=checkbox]");
          const lab = li.querySelector("label");
          if (lab && cb) items.push({ text: lab.textContent.trim(), done: cb.checked });
        });
        lastSavedPayload = { intent: "todolist", items, sourceText: lastText, extractedAt: new Date().toISOString() };
        const json = JSON.stringify(lastSavedPayload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        lastBlobUrl = URL.createObjectURL(blob);
        console.log("Todo list:", lastSavedPayload);
        closeModal();
        showToast("Todo list saved — wire to Google Tasks API later", lastBlobUrl);
        return;
      }

      if (currentIntent === "note") {
        lastSavedPayload = {
          intent: "note",
          title: fNoteTitle.value,
          body: fNoteBody.value,
          extractedAt: new Date().toISOString(),
        };
        try {
          const arr = JSON.parse(localStorage.getItem("cameraNotes") || "[]");
          arr.push(lastSavedPayload);
          localStorage.setItem("cameraNotes", JSON.stringify(arr.slice(-40)));
        } catch (e) {
          console.warn(e);
        }
        const json = JSON.stringify(lastSavedPayload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        lastBlobUrl = URL.createObjectURL(blob);
        closeModal();
        showToast("Note saved on this device", lastBlobUrl);
        return;
      }

      lastSavedPayload = buildPayload();
      const json = JSON.stringify(lastSavedPayload, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      lastBlobUrl = URL.createObjectURL(blob);

      console.log("Saved (demo — wire to Calendar / Tasks API):", lastSavedPayload);

      const labels = {
        event: "Added to Calendar",
        task: "Task created",
        reminder: "Reminder set",
      };
      closeModal();
      showToast(labels[currentIntent] || "Saved", lastBlobUrl);
    }

    (async function boot() {
      try {
        await initTesseract();
        await startCamera();
        setInterval(runOcrFrame, OCR_INTERVAL_MS);
        runOcrFrame();
      } catch (err) {
        alert(
          "Camera or OCR failed: " +
            (err && err.message ? err.message : err) +
            "\n\nUse https:// or localhost and allow camera access."
        );
        console.error(err);
      }
    })();

    document.getElementById("btnFlip").addEventListener("click", async () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      try {
        await startCamera();
      } catch (e) {
        console.error(e);
      }
    });

    document.getElementById("btnShutter").addEventListener("click", () => runOcrFrame());

    btnEvent.addEventListener("click", () => openModal("event"));
    btnTask.addEventListener("click", () => openModal("task"));
    btnGoogleDoc.addEventListener("click", () => openModal("gdoc"));
    btnTodoList.addEventListener("click", () => openModal("todolist"));
    btnNote.addEventListener("click", () => openModal("note"));
    btnReminder.addEventListener("click", () => openModal("reminder"));
    btnShare.addEventListener("click", () => openModal("share"));

    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.getElementById("btnCloseModal").addEventListener("click", closeModal);

    btnSave.addEventListener("click", () => {
      if (currentIntent === "share" || currentIntent === "gdoc") {
        closeModal();
        return;
      }
      saveAction();
    });

    document.getElementById("btnCopyOpenDocs").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(lastText || "");
        window.open("https://docs.new", "_blank", "noopener,noreferrer");
        showToast("Copied — paste in the new Google Doc (⌘V)", null);
        closeModal();
      } catch (e) {
        showToast("Clipboard blocked — use Share", null);
      }
    });

    document.getElementById("btnCopy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(sharePreview.textContent || "");
        showToast("Copied to clipboard", null);
      } catch {
        showToast("Select text manually", null);
      }
    });

    btnShareNative.addEventListener("click", async () => {
      const text = sharePreview.textContent || "";
      try {
        await navigator.share({ title: "Camera extract", text });
        closeModal();
        showToast("Shared", null);
      } catch (e) {
        if (e && e.name !== "AbortError") console.warn(e);
      }
    });

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });

    toastView.addEventListener("click", (e) => {
      if (!toastView.href || toastView.style.display === "none") {
        e.preventDefault();
        return;
      }
      e.preventDefault();
      window.open(toastView.href, "_blank", "noopener,noreferrer");
    });
  </script>
</body>

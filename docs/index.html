<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Complete an action — Camera Intent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eeebe3;
      --bg-dark: #0a0a0c;
      --surface: #16161a;
      --text: #f4f4f5;
      --text-dark: #18181b;
      --muted: #71717a;
      --accent: #ed4335;
      --accent-hover: #d63b2e;
      --pill: rgba(255, 255, 255, 0.12);
      --intent-pill-w: 142px;
      --intent-pill-h: 38px;
      --intent-pill-radius: 18px;
      --card-tint: #efd3d0;
      --radius: 16px;
      --modal-blue: #007aff;
      --modal-blue-press: #0066dd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      background: #000;
    }

    video {
      width: 100%;
      height: 100dvh;
      object-fit: cover;
      display: block;
    }

    canvas { display: none; }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 45%);
    }

    /* Intent pills — compact grid, uniform size */
    .intent-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 154px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .intent-wrap.has-intents {
      opacity: 1;
      pointer-events: auto;
    }

    .intent-panel {
      width: 100%;
      max-width: 304px;
      background: transparent;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .intent-hint {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      margin: 0 0 2px;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      max-width: 304px;
    }

    .intent-hint.hidden {
      display: none;
    }

    /* Flex (not grid) so when one pill in a row is .hidden, the visible pill stays centered */
    .intent-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      margin: 0 auto;
      justify-content: center;
      align-items: center;
    }

    .intent-row.cols-2 {
      max-width: calc(2 * var(--intent-pill-w) + 8px);
    }

    .intent-row.cols-1 {
      max-width: var(--intent-pill-w);
    }

    .intent-row.cols-3 {
      max-width: calc(3 * var(--intent-pill-w) + 16px);
    }

    .intent-label {
      display: none;
    }

    .intent-pill {
      appearance: none;
      margin: 0;
      padding: 0 8px;
      width: var(--intent-pill-w);
      min-width: var(--intent-pill-w);
      max-width: var(--intent-pill-w);
      height: var(--intent-pill-h);
      min-height: var(--intent-pill-h);
      border-radius: var(--intent-pill-radius);
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: rgba(12, 12, 14, 0.92);
      background: rgba(255, 255, 255, 0.86);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-sizing: border-box;
    }

    .intent-pill .ico {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      opacity: 0.88;
    }

    .intent-pill .pill-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .intent-pill:hover {
      background: rgba(255, 255, 255, 0.92);
    }

    .intent-pill:active { transform: scale(0.97); }
    .intent-pill.hidden { display: none; }

    .camera-modes {
      position: absolute;
      bottom: 112px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
      z-index: 8;
    }

    .camera-modes span.active { color: var(--text); font-weight: 600; }

    .shutter-row {
      position: absolute;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding-bottom: 8px;
      pointer-events: auto;
      z-index: 10;
    }

    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--surface);
      border: 2px solid rgba(255,255,255,0.2);
    }

    .shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.35);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter::after {
      content: "";
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff;
    }

    .flip {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    /* Modal — centered card (Create event mockup) */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: #fff;
      color: var(--text-dark);
      border-radius: 16px;
      padding: 0;
      transform: scale(0.94);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.28s ease;
      max-height: min(85dvh, 620px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
    }

    .backdrop.open .modal {
      transform: scale(1);
      opacity: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
      flex-shrink: 0;
    }

    .modal-header h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
      color: #1c1c1e;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      font-size: 24px;
      line-height: 1;
      color: #8e8e93;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: #f2f2f7;
      color: #1c1c1e;
    }

    .modal-body-scroll {
      overflow-y: auto;
      padding: 0 16px 16px;
      flex: 1;
      min-height: 0;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 12px;
      line-height: 1.4;
    }

    .modal-sub.hidden {
      display: none;
    }

    .event-name-field {
      margin-bottom: 16px;
    }

    .event-name-field input {
      width: 100%;
      border: none;
      padding: 0;
      font-size: 17px;
      font-weight: 700;
      color: #000;
      font-family: inherit;
      background: transparent;
    }

    .event-name-field input::placeholder {
      color: #c7c7cc;
      font-weight: 600;
    }

    .section-label {
      display: none;
    }

    .row-field {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f2f2f7;
    }

    .row-field:last-of-type {
      border-bottom: none;
    }

    .row-ico {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 2px;
      color: #8e8e93;
    }

    .row-field input,
    .row-field textarea {
      flex: 1;
      border: none;
      padding: 0;
      font-size: 16px;
      font-family: inherit;
      color: #000;
      background: transparent;
      min-width: 0;
    }

    .row-field textarea {
      min-height: 72px;
      resize: vertical;
      line-height: 1.4;
    }

    .row-field input::placeholder,
    .row-field textarea::placeholder {
      color: #c7c7cc;
    }

    .field {
      margin-bottom: 0;
    }

    .field label {
      display: none;
    }

    .more {
      margin: 4px 0 0;
      border: none;
      border-radius: 0;
      padding: 0;
      background: transparent;
    }

    .more summary {
      list-style: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 400;
      padding: 12px 0 4px;
      color: var(--modal-blue);
      user-select: none;
    }

    .more summary::-webkit-details-marker { display: none; }

    .more .field {
      margin-top: 8px;
    }

    .more .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .more .field input,
    .more .field textarea,
    .more .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    .more .field:last-child {
      margin-bottom: 8px;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      padding: 12px 16px max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid #f2f2f7;
      flex-shrink: 0;
    }

    .btn-text-cancel {
      background: none;
      border: none;
      font-size: 17px;
      font-weight: 400;
      color: var(--modal-blue);
      cursor: pointer;
      font-family: inherit;
      padding: 8px 4px;
    }

    .btn-save-blue {
      background: var(--modal-blue);
      color: #fff;
      border: none;
      font-size: 17px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-save-blue:hover {
      background: var(--modal-blue-press);
    }

    .btn {
      font-family: inherit;
      cursor: pointer;
    }

    .modal[data-mode="reminder"] .field-guests {
      display: none;
    }

    .modal[data-mode="task"] .field-guests {
      opacity: 0.9;
    }

    .modal[data-mode="gdoc"] #blockAction,
    .modal[data-mode="todolist"] #blockAction {
      display: none;
    }

    .modal[data-mode="gdoc"] #blockGdoc,
    .modal[data-mode="todolist"] #blockTodo {
      display: block !important;
    }

    #blockGdoc,
    #blockTodo {
      display: none;
    }

    .gdoc-steps {
      font-size: 14px;
      color: #3f3f46;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .todo-items {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .todo-items li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f2f2f7;
      font-size: 15px;
    }

    .todo-items input[type="checkbox"] {
      margin-top: 3px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: #27272a;
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 200;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      max-width: 92vw;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .toast a {
      color: #93c5fd;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

  </style>
</head>
<body>
  <div class="app" id="app">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="overlay"></div>

    <div class="intent-wrap" id="intentWrap">
      <div class="intent-panel">
        <p class="intent-hint hidden" id="intentHint"></p>
        <div class="intent-row cols-2">
          <button type="button" class="intent-pill hidden" id="btnEvent" data-intent="event" title="Add to Calendar">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
            <span class="pill-label">Calendar</span>
          </button>
          <button type="button" class="intent-pill hidden" id="btnTask" data-intent="task" title="Create Task">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            <span class="pill-label">Task</span>
          </button>
        </div>
        <div class="intent-row cols-2">
          <button type="button" class="intent-pill hidden" id="btnGoogleDoc" data-intent="gdoc" title="Send to Google Doc">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            <span class="pill-label">Doc</span>
          </button>
          <button type="button" class="intent-pill hidden" id="btnTodoList" data-intent="todolist" title="Todo list">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="9" y1="6" x2="20" y2="6" />
              <line x1="9" y1="12" x2="20" y2="12" />
              <line x1="9" y1="18" x2="20" y2="18" />
              <circle cx="5" cy="6" r="1.5" fill="currentColor" stroke="none" />
              <circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none" />
              <circle cx="5" cy="18" r="1.5" fill="currentColor" stroke="none" />
            </svg>
            <span class="pill-label">List</span>
          </button>
        </div>
        <div class="intent-row cols-1">
          <button type="button" class="intent-pill hidden" id="btnReminder" data-intent="reminder" title="Reminder">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3L2 6"/></svg>
            <span class="pill-label">Remind</span>
          </button>
        </div>
      </div>
    </div>

    <div class="camera-modes">
      <span class="active">Photo</span>
      <span>Panorama</span>
      <span>Night</span>
    </div>

    <div class="shutter-row">
      <div class="thumb" aria-hidden="true"></div>
      <button type="button" class="shutter" id="btnShutter" aria-label="Capture"></button>
      <button type="button" class="flip" id="btnFlip" aria-label="Flip camera">↻</button>
    </div>
  </div>

  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" id="actionModal" role="dialog" aria-labelledby="modalTitle" data-mode="event">
      <div class="modal-header">
        <h2 id="modalTitle">Create event</h2>
        <button type="button" class="modal-close" id="btnCloseModal" aria-label="Close">×</button>
      </div>

      <div class="modal-body-scroll" id="modalBodyScroll">
        <p class="modal-sub hidden" id="modalSub"></p>

        <div id="blockAction">
          <div class="event-name-field">
            <input type="text" id="fTitle" name="title" autocomplete="off" placeholder="Title" />
          </div>

          <div class="modal-primary" id="modalPrimary">
            <div class="row-field">
              <svg class="row-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
              <input type="text" id="fWhen" name="when" placeholder="Date and time" autocomplete="off" />
            </div>
            <div class="row-field">
              <svg class="row-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-4.5 7-11a7 7 0 10-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <input type="text" id="fLoc" name="location" placeholder="Location" autocomplete="off" />
            </div>
            <div class="row-field field-guests">
              <svg class="row-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
              <textarea id="fGuests" name="guests" placeholder="Guests" rows="2"></textarea>
            </div>
          </div>

          <details class="more" id="moreOptions">
            <summary>More options</summary>
            <div class="field">
              <label for="fNotes">Notes</label>
              <textarea id="fNotes" placeholder="Optional notes"></textarea>
            </div>
            <div class="field">
              <label for="fUrl">Meeting or map link</label>
              <input type="url" id="fUrl" placeholder="https://…" />
            </div>
            <div class="field">
              <label for="fRemind">Remind me before</label>
              <select id="fRemind">
                <option value="0">No extra reminder</option>
                <option value="5">5 minutes</option>
                <option value="15">15 minutes</option>
                <option value="60">1 hour</option>
                <option value="1440">1 day</option>
              </select>
            </div>
          </details>
        </div>

        <div id="blockGdoc">
          <p class="gdoc-steps">
            Text will be <strong>copied</strong>, then <strong>docs.new</strong> opens a blank Google Doc. Paste there (<kbd style="font-size:12px;background:#f4f4f5;padding:2px 6px;border-radius:4px;">⌘V</kbd> / Ctrl+V).
          </p>
          <p style="font-size:12px;color:#8e8e93;margin-bottom:10px;">Full Google Docs API upload needs sign-in in a backend app—this is the standard browser workaround.</p>
          <button type="button" class="btn-save-blue" id="btnCopyOpenDocs" style="width:100%;">Copy text &amp; open Google Docs</button>
        </div>

        <div id="blockTodo">
          <p style="font-size:13px;color:#8e8e93;margin-bottom:8px;">Add items (not filled from scan)</p>
          <ul class="todo-items" id="todoItems"></ul>
        </div>
      </div>

      <div class="modal-actions" id="modalFooter">
        <button type="button" class="btn-text-cancel" id="btnCancel">Cancel</button>
        <button type="button" class="btn-save-blue" id="btnSave">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite">
    <span id="toastMsg">Saved</span>
    <a href="#" id="toastView">Open</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const btnEvent = document.getElementById("btnEvent");
    const btnTask = document.getElementById("btnTask");
    const btnGoogleDoc = document.getElementById("btnGoogleDoc");
    const btnTodoList = document.getElementById("btnTodoList");
    const btnReminder = document.getElementById("btnReminder");
    const intentHint = document.getElementById("intentHint");
    const backdrop = document.getElementById("backdrop");
    const actionModal = document.getElementById("actionModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalSub = document.getElementById("modalSub");
    const fTitle = document.getElementById("fTitle");
    const fWhen = document.getElementById("fWhen");
    const fLoc = document.getElementById("fLoc");
    const fGuests = document.getElementById("fGuests");
    const fNotes = document.getElementById("fNotes");
    const fUrl = document.getElementById("fUrl");
    const fRemind = document.getElementById("fRemind");
    const todoItems = document.getElementById("todoItems");
    const btnSave = document.getElementById("btnSave");
    const toast = document.getElementById("toast");
    const toastView = document.getElementById("toastView");
    const intentWrap = document.getElementById("intentWrap");

    let stream = null;
    let facingMode = "environment";
    let worker = null;
    let ocrBusy = false;
    let lastText = "";
    let extracted = { title: "", when: "", location: "" };
    let lastClassification = null;
    let parsedTodoLines = [];
    let currentIntent = "event";
    let lastSavedPayload = null;
    let lastBlobUrl = null;
    const OCR_INTERVAL_MS = 1500;
    const MIN_TEXT_LEN = 12;
    /** Only block obviously broken OCR; stricter gating is in text/date heuristics below. */
    const MIN_OCR_CONFIDENCE_HARD = 38;

    function normalizeOcrStability(s) {
      return s
        .toLowerCase()
        .replace(/[\u0000-\u001f]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 220);
    }

    /** Reject short/gibberish frames (faces often yield junk that still passes MIN_TEXT_LEN). */
    function isPlausibleOcrText(norm) {
      if (norm.length < MIN_TEXT_LEN) return false;
      const nonAlnum = (norm.match(/[^a-z0-9\s]/gi) || []).length;
      if (nonAlnum / norm.length > 0.55) return false;
      const words = norm.split(/\s+/).filter((w) => /[a-z]{2,}/i.test(w));
      const letters = (norm.match(/[a-z]/gi) || []).length;
      const digits = (norm.match(/\d/g) || []).length;
      if (digits >= 8 && letters >= 6 && norm.length >= 14) return true;
      return (
        words.length >= 3 ||
        (letters >= 18 && words.length >= 2) ||
        (words.length >= 2 && letters >= 12)
      );
    }

    /** Date/time cues for routing (OCR-tolerant: full month names, am/pm without colon, etc.). */
    function scanDateTimeSignals(t) {
      const hasMonthDay = /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}/i.test(t);
      const hasFullMonth = /\b(january|february|march|april|may|june|july|august|september|october|november|december)\b/i.test(t);
      const hasNumericDate =
        /\b\d{1,2}[\/\-]\d{1,2}(\/\d{2,4})?\b/.test(t) ||
        /\b\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/.test(t) ||
        /\b20\d{2}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/.test(t);
      const hasTimeColon =
        /\b\d{1,2}:\d{2}\s*(?:am|pm|a\.m\.|p\.m\.)?\b/i.test(t) ||
        /\b\d{1,2}:\d{2}\b/.test(t);
      const hasTimeAmPm = /\b\d{1,2}\s*(?:am|pm|a\.m\.|p\.m\.)\b/i.test(t);
      const hasTime = hasTimeColon || hasTimeAmPm;
      const hasWeekday = /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(t);
      const hasDate = hasMonthDay || hasNumericDate || (hasFullMonth && /\d/.test(t));
      const dateAndTime = hasDate && hasTime;
      const weekdayAndTime = hasWeekday && hasTime;
      const monthAndTime = hasFullMonth && hasTime;
      const monthWeekday = hasFullMonth && hasWeekday;
      const calendarLike =
        dateAndTime || weekdayAndTime || monthAndTime || monthWeekday || (hasFullMonth && /\d/.test(t));
      return { hasDate, hasTime, dateAndTime, weekdayAndTime, calendarLike };
    }

    /** Strong date patterns only — lone `hasTime` from noise was triggering intents. */
    function hasTrustworthyDateSignal(t) {
      const dt = scanDateTimeSignals(t);
      if (dt.calendarLike) return true;
      if (/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?\b/i.test(t)) return true;
      if (/\b\d{1,2}[\/\-]\d{1,2}(?:\/\d{2,4})?\b/.test(t) || /\b20\d{2}[\/\-]\d{1,2}/.test(t)) return true;
      if (/\b(january|february|march|april|may|june|july|august|september|october|november|december)\b/i.test(t) && /\d/.test(t)) return true;
      return false;
    }

    /** English-like text — balanced so short lines (3+ words) still pass. */
    function hasTrustworthyTextSignal(norm) {
      const words = norm.split(/\s+/).filter((w) => /[a-z]{2,}/i.test(w));
      const letters = (norm.match(/[a-z]/gi) || []).length;
      const vowels = (norm.match(/[aeiouy]/gi) || []).length;
      if (letters < 15 || words.length < 3) return false;
      if (vowels < 3 || vowels / letters < 0.16) return false;
      if (words.length < 4 && letters < 20) return false;
      return true;
    }

    /** Only show intents when OCR sees real text and/or a trustworthy date — not random noise. */
    function ocrJustifiesIntents(clean, norm) {
      const t = clean.trim();
      if (hasTrustworthyDateSignal(t)) return true;
      return hasTrustworthyTextSignal(norm);
    }

    /** Heuristic OCR routing: calendar vs list vs long document */
    function classifyScan(text) {
      const t = text.trim();
      const lower = t.toLowerCase();
      const lines = t.split(/\n/).map((l) => l.trim()).filter(Boolean);

      let scores = { event: 0, todoList: 0, document: 0 };
      const listLineRe = /^(\s*[-*•]\s+|\s*\d+[\.)]\s+|\s*\[[ xX]\]\s+)/;
      const markedListLines = lines.filter((l) => listLineRe.test(l));
      const bulletish = lines.filter((l) => listLineRe.test(l));

      if (/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}/i.test(t)) scores.event += 3;
      if (/\b(january|february|march|april|may|june|july|august|september|october|november|december)\b/i.test(t)) scores.event += 2;
      if (/\b\d{1,2}[\/\-]\d{1,2}(\/\d{2,4})?\b/.test(t)) scores.event += 2;
      if (/\b\d{1,2}:\d{2}\s*(?:am|pm|a\.m\.|p\.m\.)?\b/i.test(t)) scores.event += 2;
      if (/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(t)) scores.event += 1.5;
      if (/\b(meeting|call|zoom|teams|webex|appointment|invite @|rsvp)\b/i.test(lower)) scores.event += 1.5;

      if (bulletish.length >= 2) scores.todoList += 4;
      else if (bulletish.length === 1) scores.todoList += 2;
      if (/\b(todo|to-do|action items?|groceries|shopping list|checklist|buy:|reminder:)\b/i.test(t)) scores.todoList += 2;
      if (markedListLines.length >= 3 && lines.length <= 25) scores.todoList += 2;

      if (t.length > 500) scores.document += 3;
      else if (t.length > 220) scores.document += 2;
      if (/\b(subject:|dear |sincerely|regards|memo|abstract|introduction|contract|policy|report)\b/i.test(lower)) scores.document += 3;
      if (lines.length >= 4 && lines.some((l) => l.length > 100)) scores.document += 2;

      if (t.length < 180 && lines.length <= 6) scores.document += 2;
      if (scores.event === 0 && scores.todoList === 0 && scores.document === 0) scores.document += 1;

      const dt = scanDateTimeSignals(t);
      let calendarPriority = false;
      if (dt.calendarLike) {
        scores.event += 10;
        scores.document = Math.max(0, scores.document - 10);
        scores.todoList = Math.max(0, scores.todoList - 6);
        calendarPriority = true;
      }

      const hasStrongDate = scores.event >= 2;
      const top = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
      let label = "Detected text";
      if (top[1] >= 2) {
        const labels = { event: "Date/time · likely schedule", todoList: "List · checklist / todos", document: "Long text · document" };
        label = labels[top[0]] || label;
      }

      return {
        scores,
        hasStrongDate,
        calendarPriority,
        primary: top[0],
        hint: label,
        listLines: lines.filter((l) => l.replace(listLineRe, "").trim().length > 0),
      };
    }

    /** Show only intent pills that match the strongest OCR signals (no “show everything” fallback). */
    function applyIntentVisibility(c) {
      const s = c.scores;
      const ranked = Object.entries(s).sort((a, b) => b[1] - a[1]);
      const topKey = ranked[0][0];
      const topVal = ranked[0][1];
      const secondKey = ranked[1][0];
      const secondVal = ranked[1][1];

      [
        btnEvent,
        btnTask,
        btnGoogleDoc,
        btnTodoList,
        btnReminder,
      ].forEach((b) => b.classList.add("hidden"));

      if (c.calendarPriority) {
        btnEvent.classList.remove("hidden");
        btnReminder.classList.remove("hidden");
        intentHint.textContent = "Looks like a date and time — calendar or reminder";
        intentHint.classList.remove("hidden");
        return;
      }

      const WIN = 2;
      const NEAR = 1.15;
      const secondIsRunnerUp = secondVal >= topVal - NEAR && secondVal >= 1.35;

      const reveal = (key) => {
        if (key === "event") btnEvent.classList.remove("hidden");
        if (key === "todoList") btnTodoList.classList.remove("hidden");
        if (key === "document") btnGoogleDoc.classList.remove("hidden");
      };

      if (topVal < 1.5) {
        btnGoogleDoc.classList.remove("hidden");
        intentHint.textContent = "Scan a date, a list, or a block of text";
        intentHint.classList.remove("hidden");
        return;
      }

      if (topVal >= WIN) {
        reveal(topKey);
        if (secondIsRunnerUp && secondKey !== topKey) {
          reveal(secondKey);
        }
        if (s.todoList >= 1.2 && s.todoList < WIN && s.document < 2 && topKey !== "document") {
          btnTask.classList.remove("hidden");
        }
      } else {
        reveal(topKey);
        if (secondVal >= 1.4) reveal(secondKey);
        if (s.todoList >= 1.2 && s.todoList < WIN && s.document < 2) btnTask.classList.remove("hidden");
      }

      const hintMap = {
        event: "Looks like a date or schedule",
        todoList: "Looks like a checklist",
        document: "Looks like a document or long text",
      };
      intentHint.textContent = hintMap[topKey] || "Text detected";
      intentHint.classList.remove("hidden");
    }

    function showIntents(show) {
      intentWrap.classList.toggle("has-intents", show);
      if (!show) {
        intentHint.classList.add("hidden");
        [
          btnEvent,
          btnTask,
          btnGoogleDoc,
          btnTodoList,
          btnReminder,
        ].forEach((el) => el.classList.add("hidden"));
      }
    }

    function guessTitle(text) {
      const lines = text.split(/\n/).map((l) => l.trim()).filter(Boolean);
      for (const line of lines) {
        if (line.length < 4) continue;
        if (/^\d{1,2}[\/\-]\d{1,2}/.test(line) && line.length < 30) continue;
        if (/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(line) && /\d{4}/.test(line)) continue;
        return line.slice(0, 120);
      }
      return lines[0] || "Untitled";
    }

    function extractDateTime(text) {
      const t = text.replace(/\s+/g, " ");
      const parts = [];
      const monthDay = t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,?\s*\d{4})?/i);
      if (monthDay) parts.push(monthDay[0].trim());
      const slash = t.match(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/);
      if (slash && !parts.some((p) => p.includes(slash[0]))) parts.push(slash[0]);
      const time12 = t.match(/\b\d{1,2}:\d{2}\s*(?:am|pm)\b/i);
      const time24 = t.match(/\b\d{1,2}:\d{2}\b/);
      let timeStr = "";
      if (time12) timeStr = time12[0];
      else if (time24 && !time12) timeStr = time24[0];
      let when = parts.join(" · ");
      if (timeStr) when = when ? `${when} · ${timeStr}` : timeStr;
      return when;
    }

    function extractLocation(text) {
      const patterns = [
        /(?:location|room|at|venue)\s*[:\-]?\s*([^\n]+)/i,
        /(?:conference|meeting)\s+room\s+[a-z0-9\s\-]+/i,
        /\b(room|hall|building)\s+[a-z0-9][a-z0-9\s\-]*/i,
      ];
      for (const re of patterns) {
        const m = text.match(re);
        if (m) return (m[1] || m[0]).trim().slice(0, 200);
      }
      return "";
    }

    function parseEntities(fullText) {
      const title = guessTitle(fullText);
      const when = extractDateTime(fullText);
      const location = extractLocation(fullText);
      const confidence =
        (when ? 0.45 : 0) +
        (location ? 0.35 : 0) +
        (fullText.length > 40 ? 0.2 : 0.1);
      return { title, when, location, confidence: Math.min(confidence, 1) };
    }

    async function initTesseract() {
      worker = await Tesseract.createWorker("eng", 1, { logger: () => {} });
    }

    async function startCamera() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    async function runOcrFrame() {
      if (!worker || ocrBusy || !video.videoWidth) return;
      ocrBusy = true;
      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const {
          data: { text, confidence: ocrConfRaw },
        } = await worker.recognize(canvas);
        const clean = text.replace(/\|/g, "I").trim();
        if (clean.length < MIN_TEXT_LEN) {
          showIntents(false);
          return;
        }
        const norm = normalizeOcrStability(clean);
        if (!isPlausibleOcrText(norm) || !ocrJustifiesIntents(clean, norm)) {
          showIntents(false);
          return;
        }
        if (typeof ocrConfRaw === "number" && ocrConfRaw < MIN_OCR_CONFIDENCE_HARD && !hasTrustworthyDateSignal(clean)) {
          showIntents(false);
          return;
        }
        lastText = clean;
        const ent = parseEntities(clean);
        extracted = { title: ent.title, when: ent.when, location: ent.location };
        lastClassification = classifyScan(clean);
        parsedTodoLines = [];
        applyIntentVisibility(lastClassification);
        showIntents(true);
      } catch (e) {
        console.error(e);
      } finally {
        ocrBusy = false;
      }
    }

    function resetForm() {
      fNotes.value = "";
      fUrl.value = "";
      fRemind.value = "0";
      document.getElementById("moreOptions").open = false;
    }

    function renderTodoList() {
      todoItems.innerHTML = "";
      const items = [""];
      items.forEach((text, i) => {
        const li = document.createElement("li");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.id = "todo-cb-" + i;
        const lab = document.createElement("label");
        lab.htmlFor = cb.id;
        lab.textContent = text.trim() || "\u00a0";
        li.appendChild(cb);
        li.appendChild(lab);
        todoItems.appendChild(li);
      });
    }

    function openModal(intent) {
      currentIntent = intent;
      resetForm();
      actionModal.dataset.mode = intent;

      if (intent === "gdoc") {
        modalTitle.textContent = "Send to Google Docs";
        modalSub.classList.add("hidden");
        btnSave.textContent = "Close";
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        return;
      }

      if (intent === "todolist") {
        modalTitle.textContent = "Todo list";
        modalSub.classList.add("hidden");
        renderTodoList();
        btnSave.textContent = "Save list";
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        return;
      }

      modalSub.classList.add("hidden");
      btnSave.textContent = "Save";

      /* No OCR prefill — fields start empty so users type what they want */
      fWhen.value = "";
      fLoc.value = "";
      fGuests.value = "";
      fTitle.value = "";

      if (intent === "event") {
        modalTitle.textContent = "Create event";
        fTitle.placeholder = "Title";
        fWhen.placeholder = "Date and time";
        fLoc.placeholder = "Location";
        fGuests.placeholder = "Guests";
      } else if (intent === "task") {
        modalTitle.textContent = "Create task";
        fTitle.placeholder = "Title";
        fWhen.placeholder = "Date and time";
        fLoc.placeholder = "Location";
        fGuests.placeholder = "Guests";
      } else if (intent === "reminder") {
        modalTitle.textContent = "Set reminder";
        fTitle.placeholder = "Title";
        fWhen.placeholder = "Date and time";
        fLoc.placeholder = "Location";
        fGuests.placeholder = "Guests";
      }

      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
      actionModal.dataset.mode = "event";
      btnSave.textContent = "Save";
      todoItems.innerHTML = "";
    }

    function buildPayload() {
      return {
        intent: currentIntent,
        title: fTitle.value,
        when: fWhen.value,
        location: fLoc.value,
        guests: fGuests.value,
        notes: fNotes.value,
        meetingUrl: fUrl.value,
        remindMinutesBefore: parseInt(fRemind.value, 10) || 0,
        extractedAt: new Date().toISOString(),
      };
    }

    function showToast(msg, openUrl) {
      document.getElementById("toastMsg").textContent = msg;
      if (lastBlobUrl) {
        URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = null;
      }
      if (openUrl) {
        toastView.href = openUrl;
        toastView.style.display = "inline";
      } else {
        toastView.style.display = "none";
      }
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 4000);
    }

    function saveAction() {
      if (currentIntent === "gdoc") {
        closeModal();
        return;
      }

      if (currentIntent === "todolist") {
        const items = [];
        todoItems.querySelectorAll("li").forEach((li) => {
          const cb = li.querySelector("input[type=checkbox]");
          const lab = li.querySelector("label");
          if (lab && cb) items.push({ text: lab.textContent.trim(), done: cb.checked });
        });
        lastSavedPayload = { intent: "todolist", items, sourceText: lastText, extractedAt: new Date().toISOString() };
        const json = JSON.stringify(lastSavedPayload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        lastBlobUrl = URL.createObjectURL(blob);
        console.log("Todo list:", lastSavedPayload);
        closeModal();
        showToast("Todo list saved — wire to Google Tasks API later", lastBlobUrl);
        return;
      }

      lastSavedPayload = buildPayload();
      const json = JSON.stringify(lastSavedPayload, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      lastBlobUrl = URL.createObjectURL(blob);

      console.log("Saved (demo — wire to Calendar / Tasks API):", lastSavedPayload);

      const labels = {
        event: "Added to Calendar",
        task: "Task created",
        reminder: "Reminder set",
      };
      closeModal();
      showToast(labels[currentIntent] || "Saved", lastBlobUrl);
    }

    (async function boot() {
      try {
        await initTesseract();
        await startCamera();
        setInterval(runOcrFrame, OCR_INTERVAL_MS);
        runOcrFrame();
      } catch (err) {
        alert(
          "Camera or OCR failed: " +
            (err && err.message ? err.message : err) +
            "\n\nUse https:// or localhost and allow camera access."
        );
        console.error(err);
      }
    })();

    document.getElementById("btnFlip").addEventListener("click", async () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      try {
        await startCamera();
      } catch (e) {
        console.error(e);
      }
    });

    document.getElementById("btnShutter").addEventListener("click", () => runOcrFrame());

    btnEvent.addEventListener("click", () => openModal("event"));
    btnTask.addEventListener("click", () => openModal("task"));
    btnGoogleDoc.addEventListener("click", () => openModal("gdoc"));
    btnTodoList.addEventListener("click", () => openModal("todolist"));
    btnReminder.addEventListener("click", () => openModal("reminder"));

    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.getElementById("btnCloseModal").addEventListener("click", closeModal);

    btnSave.addEventListener("click", () => {
      if (currentIntent === "gdoc") {
        closeModal();
        return;
      }
      saveAction();
    });

    document.getElementById("btnCopyOpenDocs").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(lastText || "");
        window.open("https://docs.new", "_blank", "noopener,noreferrer");
        showToast("Copied — paste in the new Google Doc (⌘V)", null);
        closeModal();
      } catch (e) {
        showToast("Clipboard blocked — allow clipboard or copy manually", null);
      }
    });

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });

    toastView.addEventListener("click", (e) => {
      if (!toastView.href || toastView.style.display === "none") {
        e.preventDefault();
        return;
      }
      e.preventDefault();
      window.open(toastView.href, "_blank", "noopener,noreferrer");
    });
  </script>
</body>
